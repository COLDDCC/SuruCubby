<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拼团后台</title>
<link rel="icon" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0e2a47">
<link rel="stylesheet" href="/style.css">
</head>
<body class="admin">
<!-- 宽屏左侧分组导航，窄屏退回成顶栏 + 横滑导航。#nav / #logout / #view / #rail 这几个 id app.js 在用，别改 -->
<div class="app">
  <aside class="sidebar">
    <span class="brand"><img src="/logo.svg" alt="">拼团后台</span>
    <nav id="nav" aria-label="后台导航">
      <span class="nav-group">日常</span>
      <a href="#/">待办</a>
      <a href="#/import">导入</a>
      <a href="#/batches">订单</a>
      <a href="#/customers">客户</a>
      <a href="#/parcels">直邮包裹</a>
      <span class="nav-group">账目</span>
      <a href="#/payments">收款</a>
      <span class="nav-group">系统</span>
      <a href="#/settings">设置</a>
      <span class="nav-group legacy">旧流程</span>
      <a class="legacy" href="#/packages">包裹</a>
      <a class="legacy" href="#/shipments">寄出</a>
    </nav>
    <button id="logout" class="plain small">退出</button>
  </aside>
  <div class="shell">
    <main class="wrap" id="view"><p class="muted">加载中…</p></main>
    <aside class="rail" id="rail" hidden>
      <label for="rail-q">找货</label>
      <input id="rail-q" inputmode="search" placeholder="货号尾号 / 名称 / 客户名" autocomplete="off">
      <p class="small muted" id="rail-tip">货号尾号、名称片段、客户名都认</p>
      <div id="rail-results"></div>
    </aside>
  </div>
</div>
<script type="module" src="/admin/app.js"></script>
</body>
</html>
