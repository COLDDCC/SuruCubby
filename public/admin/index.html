<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0ea5e9">
<title>仓库后台</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body class="admin">
<header class="topbar" id="topbar">
  <span class="brand">仓库后台</span>
  <!-- 桌面端：横排菜单；手机端换成底部标签栏，见 app.js -->
  <nav id="nav" class="nav-desktop"></nav>
  <span class="topbar-tools">
    <span id="who" class="small muted who"></span>
    <button id="search-toggle" class="plain small search-toggle" hidden aria-controls="rail" aria-expanded="false">找货</button>
    <button id="logout" class="plain small logout-desktop" hidden>退出</button>
  </span>
</header>
<div class="shell">
  <main class="wrap" id="view"><p class="muted">加载中…</p></main>
  <aside class="rail" id="rail" hidden>
    <label for="rail-q">找货</label>
    <input id="rail-q" inputmode="search" placeholder="货号尾号 / 名称 / 客户名" autocomplete="off">
    <p class="small muted" id="rail-tip">货号尾号、名称片段、客户名都认</p>
    <div id="rail-results"></div>
  </aside>
</div>
<nav id="tabbar" class="tabbar" hidden></nav>
<div id="more-sheet" class="sheet-back" hidden>
  <div class="sheet" role="dialog" aria-label="全部菜单">
    <div class="sheet-head"><strong>全部菜单</strong><button class="plain small" data-close-sheet>关闭</button></div>
    <div id="more-links" class="sheet-links"></div>
    <div class="sheet-foot"><span id="who-sheet" class="small muted"></span><button id="logout-sheet" class="plain small">退出登录</button></div>
  </div>
</div>
<script type="module" src="/admin/app.js"></script>
</body>
</html>
