<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>骏河屋拼团 · 个人仓库</title>
<link rel="icon" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0e2a47">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="entry-hero">
  <img src="/logo.svg" alt="">
  <h1>骏河屋拼团 · 个人仓库</h1>
  <p>买了什么、到哪了、单号多少，自己登进来看</p>
</header>
<div class="wrap entry-card">
  <div class="card">
    <div class="entry-roles segmented block" role="group" aria-label="选身份">
      <button id="tab-user" class="on" type="button" aria-pressed="true">我是团员</button>
      <button id="tab-admin" type="button" aria-pressed="false">我是群主</button>
      <a href="/wh/">我是仓库</a>
    </div>

    <form id="form-user">
      <label for="qq">QQ 号</label>
      <input id="qq" name="qq" inputmode="numeric" autocomplete="username" placeholder="例如 123456789">
      <label for="user-pw">密码</label>
      <input id="user-pw" type="password" autocomplete="current-password" placeholder="第一次登录用群主给的初始密码">
      <p><button class="btn" type="submit">进入我的仓库</button></p>
      <p class="small muted">忘了密码就在群里找群主，他能帮你重设。</p>
    </form>

    <form id="form-admin" hidden>
      <label for="admin-pw">后台密码</label>
      <input id="admin-pw" type="password" autocomplete="current-password">
      <p><button class="btn" type="submit">进入后台</button></p>
    </form>

    <p id="msg" class="small" role="status" aria-live="polite" hidden></p>
  </div>
  <p class="small muted" style="text-align:center">仓库的同事点「我是仓库」，用群主给的账号登录。以前发的专属链接 <code>/w/…</code> 照样能打开。</p>
</div>
<script type="module" src="/entry.js"></script>
</body>
</html>
